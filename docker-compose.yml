name: logpulse

services:
  mysql:
    image: mysql:8.0
    container_name: logpulse-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-logpulse_root_password}
      MYSQL_DATABASE: ${DB_NAME:-logpulse}
      MYSQL_USER: ${DB_USER:-logpulse_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-logpulse_password}
    ports:
      - "3307:3306"
    volumes:
      - logpulse-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: logpulse-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack:3.8
    container_name: logpulse-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,sns
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - PERSISTENCE=0
    volumes:
      - logpulse-localstack-data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  logpulse-mysql-data:
    name: logpulse-mysql-data
  logpulse-localstack-data:
    name: logpulse-localstack-data

networks:
  default:
    name: logpulse-network
